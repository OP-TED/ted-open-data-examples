name: Check query basename uniqueness

# The `.sparql` files are a shared pool that several tools draw from, and a
# filename is how a query is referred to outside the index that lists it. Two
# queries called `notices-per-day.sparql` in different folders are therefore
# two things with one name, whoever is doing the referring.
#
# Runs on every pull request, with no path filter. A required check that only
# runs sometimes cannot be satisfied the rest of the time: nothing reports,
# and the pull request waits for a status that will never arrive. The script
# reads one YAML file, so running it always costs seconds.

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check-basenames:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Check for basename collisions
        run: python3 ci/check_unique_basenames.py web-library.yaml
