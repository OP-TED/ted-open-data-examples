name: Check query basename uniqueness

# The ted-open-data web app's query library fetcher keys a JSON lookup
# table by the basename of each entry's `sparql:` path
# (query.sparql.split('/').pop()), not the full path. Two entries with
# different paths but the same filename would silently collide in the
# web app with no error. This workflow catches that before merge.

on:
  pull_request:
    paths:
      - 'web-library.yaml'
      - 'queries/**'
      - 'ci/check_unique_basenames.py'
      - '.github/workflows/check-query-names.yml'
  push:
    branches: [main, develop]
    paths:
      - 'web-library.yaml'
      - 'queries/**'
      - 'ci/check_unique_basenames.py'
      - '.github/workflows/check-query-names.yml'

jobs:
  check-basenames:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Check for basename collisions
        run: python3 ci/check_unique_basenames.py web-library.yaml
